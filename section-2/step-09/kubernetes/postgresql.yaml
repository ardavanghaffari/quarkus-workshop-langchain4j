---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: ardavan-ghaffari-dev
  labels:
    app: postgresql
spec:
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgresql
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: ardavan-ghaffari-dev
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: miles-and-smiles
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miles-and-smiles
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: miles-and-smiles
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # PostgreSQL was still initializing when its liveness probe began checking it.
          # The probe failed because PostgreSQL was not yet accepting connections, so Kubernetes
          # restarted the container. The restart kept the pod's temporary data directory, which
          # contained an incomplete database setup. PostgreSQL then skipped initialization, leaving
          # out the milesandsmiles database and the remote-client access rule. Kubernetes marked
          # the restarted pod Ready because PostgreSQL itself was listening, but the application
          # could not connect to the incomplete database. The liveness probe starts checking after
          # 30 seconds and restarts the container after three failed checks. Kubernetes does not run
          # liveness or readiness probes for as long as the startup probe runs. It gives PostgreSQL
          # up to roughly five minutes to start successfully, then the original liveness probe
          # takes over.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: postgres-storage
          emptyDir: { }
